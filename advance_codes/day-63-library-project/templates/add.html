{% extends 'base.html' %}

{% block title %}Add Book{% endblock %}

{% block content %}
  <body>
    <form class="mt-3 ms-3" action="{{ url_for('add') }}" method="POST">
      <label>Book Name</label>
      <input class="col-3" type="text" name="book_name" />
      <label>Book Author</label>
      <input class="col-3" type="text" name="book_author" />
      <label>Rating</label>
      <input class="col-1" type="text" name="rating" />
      <button class="ms-2 btn btn-secondary" type="submit">Add Book</button>
    </form>
  </body>
{% endblock %}
