<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<!-- Container with top margin -->
<div class="container mt-4">
    <!-- FORM: row layout, small gap between columns, vertically centered items -->
    <form class="row g-2 align-items-center" role="form" method="post" action="{{ url_for('receive_data') }}">
        <!-- Name label (kept in its own column) -->
        <!-- This column auto-sizes to the content (label) -->
        <div class="col-auto">
            <label for="name" class="col-form-label">Name</label>
        </div>

        <!-- Name input -->
        <!-- col-auto keeps it only as wide as needed; change to 'col' to let it grow -->
        <div class="col-auto">
            <input type="text" class="form-control" id="name" name="username" placeholder="Name" required aria-label="Name">
        </div>

        <!-- Password label -->
        <div class="col-auto">
            <label for="password" class="col-form-label">Password</label>
        </div>

        <!-- Password input -->
        <div class="col-auto">
            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required
                   aria-label="Password">
        </div>

        <!-- Submit button -->
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Ok</button>
        </div>
    </form>
</div>

<!-- Optional: Bootstrap JS bundle (only needed for some components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
